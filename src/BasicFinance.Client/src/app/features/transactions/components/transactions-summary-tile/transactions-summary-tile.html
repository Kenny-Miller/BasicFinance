<section hlmCard class="relative h-full gap-2 rounded-sm">
  <div class="absolute inset-0 h-0.5" [ngClass]="topBarClass()"></div>

  <div hlmCardHeader>
    <h3 hlmCardTitle class="text-xs">{{ title() }}</h3>
  </div>
  <div hlmCardContent class="flex-1">
    @if (isCurrency()) {
      <div class="text-2xl font-semibold">{{ currentValue() | currency }}</div>
    } @else {
      <div class="text-2xl font-semibold">{{ currentValue() }}</div>
    }
  </div>

  <div hlmCardFooter>
    <div class="w-full border-t pt-2 text-xs">
      <span [ngClass]="footerClass()">{{ deltaText() }}</span
      ><span class="text-gray-500 dark:text-gray-400">&nbsp;vs {{ deltaLabel() }}</span>
    </div>
  </div>
</section>
