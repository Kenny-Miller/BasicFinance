<main class="flex flex-col gap-4 p-4">
  @if (loading()) {
    <app-home-skeleton />
  } @else if (error()) {
    <div class="flex flex-col items-center justify-center py-8 text-muted-foreground">
      <p class="text-lg font-medium">Failed to load your financial overview</p>
      <button variant="outline" hlmBtn class="mt-2" (click)="refetchAll()">Retry</button>
    </div>
  } @else {
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
      <app-summary-card
        title="Net Worth"
        [currentPeriodValue]="data().currentPeriodTotalBalance"
        [previousPeriodValue]="data().previousPeriodBalance"
      />

      <app-summary-card
        title="Checking"
        [currentPeriodValue]="data().currentPeriodCheckingBalance"
        [previousPeriodValue]="data().previousPeriodCheckingBalance"
      />

      <app-summary-card
        title="Savings"
        [currentPeriodValue]="data().currentPeriodSavingsBalance"
        [previousPeriodValue]="data().previousPeriodSavingsBalance"
      />

      <app-summary-card
        title="Investments"
        [currentPeriodValue]="data().currentPeriodInvestmentsBalance"
        [previousPeriodValue]="data().previousPeriodInvestmentsBalance"
      />
    </div>

    <div class="grid grid-cols-1 gap-4 xl:grid-cols-2">
      <app-spend-activity-chart [theme]="appTheme()" [data]="data().spendingOverTime" />
      <app-account-net-worth-breakdown
        [data]="data().currentPeriodBreakdown"
        [accountTypes]="accountTypes()"
      />
    </div>

    <app-recent-transactions [transactions]="data().recentTransactions" />
  }
</main>
