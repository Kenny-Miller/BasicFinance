<main class="flex flex-col gap-4 p-4">
  @if (loading()) {
    <app-spending-skeleton />
  } @else if (error()) {
    <div class="flex flex-col items-center justify-center py-8 text-muted-foreground">
      <p class="text-lg font-medium">Failed to load spending data</p>
      <button hlmBtn variant="outline" class="mt-2" (click)="refetchAll()">Retry</button>
    </div>
  } @else {
    <app-period-selector [activePeriod]="selectedPeriod()" (periodChange)="selectPeriod($event)" />

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
      <app-spending-summary-tile
        [totalIncome]="data().totalIncome"
        [totalSpend]="data().totalSpend"
      />
      <app-category-pie-chart [theme]="appTheme()" [data]="data()" />
    </div>

    <app-category-breakdown-list [data]="data()" />
  }
</main>
