<section hlmCard class="flex flex-col gap-2 rounded-sm">
  <div hlmCardHeader>
    <h3 hlmCardTitle>Category Breakdown</h3>
  </div>
  <div hlmCardContent>
    <div class="space-y-1">
      @for (row of rows(); track row.code) {
        <div class="flex items-center gap-4 rounded px-3 py-2 hover:bg-muted/50">
          <span class="flex-1 truncate font-medium">{{ row.name }}</span>
          <span class="w-28 text-right font-mono text-sm">{{ row.amount | currency }}</span>
          <span class="w-16 text-right text-sm text-muted-foreground"
            >{{ row.percentOfSpend | number: '1.1-1' }}%</span
          >
          <div class="h-2 w-32 overflow-hidden rounded-full bg-muted">
            <div class="h-full rounded-full bg-primary" [style.width.%]="row.percentOfSpend"></div>
          </div>
        </div>
      }
    </div>
    <div class="mt-2 flex items-center gap-4 border-t px-3 py-3">
      <span class="flex-1 font-semibold">Total Spend</span>
      <span class="w-28 text-right font-mono text-sm font-semibold">{{
        totalSpend() | currency
      }}</span>
      <span class="w-16 text-right text-sm font-semibold">100%</span>
      <div class="w-32"></div>
    </div>
  </div>
</section>
