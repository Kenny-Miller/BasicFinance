<section hlmCard class="h-full gap-2 rounded-sm relative">
  <div class="h-0.5 absolute inset-0" [ngClass]="topBarClass()"></div>

  <div hlmCardHeader>
    <h3 hlmCardTitle class="text-xs">{{ title() }}</h3>
  </div>
  <div hlmCardContent class="flex-1">
    <div class="font-semibold text-2xl">{{ currentPeriodValue() | currency }}</div>
  </div>

  <div hlmCardFooter>
    <div class="text-xs w-full border-t pt-2">
      <span [ngClass]="footerClass()">{{ deltaText() }}</span
      ><span class="text-gray-500 dark:text-gray-400">&nbsp;vs last month</span>
    </div>
  </div>
</section>
