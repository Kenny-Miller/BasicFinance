<nav class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
  <div class="flex items-center gap-4">
    <p class="text-sm text-gray-500">
      Showing
      <span class="tabular-nums">{{ rangeStart() }}–{{ rangeEnd() }}</span>
      of <span class="tabular-nums">{{ totalCount() }}</span>
    </p>
    <div class="hidden items-center gap-2 sm:flex">
      <span class="text-sm text-gray-500">Rows</span>
      <hlm-select [value]="currentPageSize()" (valueChange)="selectPageSize($event)">
        <hlm-select-trigger size="sm" class="w-20 shrink-0">
          <hlm-select-value />
        </hlm-select-trigger>
        <hlm-select-content *hlmSelectPortal class="min-w-20">
          @for (option of pageSizeOptions; track option) {
            <hlm-select-item [value]="option">{{ option }}</hlm-select-item>
          }
        </hlm-select-content>
      </hlm-select>
    </div>
  </div>
  <div class="flex items-center gap-2">
    <button
      hlmBtn
      variant="outline"
      size="sm"
      [disabled]="previousDisabled()"
      (click)="changePage(currentPage() - 1)"
    >
      <ng-icon name="lucideChevronLeft" class="size-4" />
      <span class="hidden sm:inline">Previous</span>
    </button>
    <div class="flex items-center gap-1">
      @for (item of pageWindow(); track $index) {
        @if (item === null) {
          <span class="px-1 text-sm text-gray-400">…</span>
        } @else {
          <button
            hlmBtn
            variant="outline"
            size="sm"
            class="w-8"
            [class.font-semibold]="item === currentPage()"
            (click)="changePage(item)"
          >
            {{ item }}
          </button>
        }
      }
    </div>
    <button
      hlmBtn
      variant="outline"
      size="sm"
      [disabled]="nextDisabled()"
      (click)="changePage(currentPage() + 1)"
    >
      <span class="hidden sm:inline">Next</span>
      <ng-icon name="lucideChevronRight" class="size-4" />
    </button>
    <div class="ml-1 hidden items-center gap-1 md:flex">
      <label class="text-sm text-gray-500" for="page-selector-input">Go to</label>
      <input
        id="page-selector-input"
        type="number"
        hlmInput
        class="w-16"
        min="1"
        [max]="totalPages()"
        [value]="pageSelector() ?? ''"
        (change)="pageSelectorChanged($event)"
        (keydown)="pageSelectorKeydown($event)"
      />
      <button hlmBtn variant="ghost" size="sm" aria-label="Go to page" (click)="selectPage()">
        <ng-icon name="lucideCornerDownLeft" class="size-4" />
      </button>
    </div>
  </div>
</nav>
